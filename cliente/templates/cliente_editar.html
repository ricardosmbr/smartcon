{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'cliente/clients.css' %}?v=2">{% endblock %}
{% block content %}
<main class="clients-page clients-form-page">
  <a class="clients-back" href="{% url 'cli:cliente' %}">← Voltar para clientes</a>
  <section class="clients-form-card">
    <p class="clients-eyebrow">Relacionamentos</p><h1>Editar cliente</h1><p class="clients-subtitle">Atualize as informações do cadastro.</p>
    <form method="post" class="clients-form">{% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}<label class="clients-field"><span>{{ field.label }}</span>{{ field }}{% if field.errors %}<small class="clients-field-error">{{ field.errors|join:", " }}</small>{% endif %}</label>{% endfor %}
      <div class="clients-form-actions"><a class="clients-cancel" href="{% url 'cli:cliente' %}">Cancelar</a><button class="clients-primary" type="submit">Salvar alterações</button></div>
    </form>
  </section>
</main>
{% endblock %}
