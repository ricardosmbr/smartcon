{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'cliente/clients.css' %}?v=2">{% endblock %}
{% block content %}
<main class="clients-page clients-form-page">
  <a class="clients-back" href="{% url 'cli:cliente' %}">← Voltar para clientes</a>
  <section class="clients-form-card">
    <p class="clients-eyebrow">Relacionamentos</p><h1>Dados do cliente</h1><p class="clients-subtitle">Cadastro criado em {{ cliente.create_at|date:"d/m/Y" }}.</p>
    <div class="clients-form">
      {% for field in form %}<label class="clients-field"><span>{{ field.label }}</span>{{ field }}</label>{% endfor %}
      <div class="clients-form-actions"><a class="clients-cancel" href="{% url 'cli:cliente' %}">Fechar</a><a class="clients-primary" href="{% url 'cli:cliente_editar' cliente.pk %}">Editar cliente</a></div>
    </div>
  </section>
</main>
{% endblock %}
