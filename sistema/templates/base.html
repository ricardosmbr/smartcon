<!doctype html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smartcon System - Sistema de controle de Contratos Inteligentes" />
    <title>SMARTCON SYSTEM</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script type="text/javascript" src="http://webpjs.appspot.com/js/webpjs-0.0.2.min.js"></script>
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.js' %}"></script>
    <script src="{% static 'js/jquery.mask.js' %}"></script>
</head>
<body>
    <button class="sidebar-toggle" type="button" aria-label="Abrir ou recolher menu" aria-controls="side-menu" aria-expanded="true">
        <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <div class="sidebar-backdrop" data-menu-close></div>
 
    <div class="app-content">
    <div class="mainbody">
            {% if messages %}
            {% for message in messages %}
            <div class="alert {% if 'error' in message.tags %}alert-danger{% elif 'success' in message.tags %}alert-success{% else %}alert-info{% endif %} text-center" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <div class="footer">
            <div class="footerline">
            <i class="far fa-address-card"></i>          
            Smartcon System - Sistema de controle de Contratos Inteligentes
            <a href="https://www.servipec.com.br" target="Servipec">&copy; 2019 By  Servipec</a>
            </div>
    </div>
    </div>
    <script>
        (function () {
            var toggle = document.querySelector('.sidebar-toggle');
            var backdrop = document.querySelector('.sidebar-backdrop');
            function isMobile() { return window.matchMedia('(max-width: 767px)').matches; }
            function closeMobileMenu() {
                document.body.classList.remove('sidebar-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
            if (isMobile()) closeMobileMenu();
            toggle.addEventListener('click', function () {
                if (isMobile()) {
                    var open = document.body.classList.toggle('sidebar-open');
                    toggle.setAttribute('aria-expanded', String(open));
                } else {
                    var collapsed = document.body.classList.toggle('sidebar-collapsed');
                    toggle.setAttribute('aria-expanded', String(!collapsed));
                }
            });
            backdrop.addEventListener('click', closeMobileMenu);
            window.addEventListener('resize', function () { if (!isMobile()) closeMobileMenu(); });
        }());
    </script>
</body>
</html>
