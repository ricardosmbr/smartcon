{% extends "contrato.html" %}
{% block dash_content %}
<section class="contracts-form-card">
  <p class="contracts-eyebrow">Configuração</p><h2>Editar contrato</h2><p class="contracts-subtitle">Atualize os dados deste contrato antes da publicação.</p>
  <form method="post" class="contracts-form">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<label class="contracts-field"><span>{{ field.label }}</span>{{ field }}{% if field.errors %}<small>{{ field.errors|join:", " }}</small>{% endif %}</label>{% endfor %}
    <div class="contracts-form-actions"><a class="contracts-form-cancel" href="{% url 'con:contrato_listar' %}">Cancelar</a><button class="contracts-primary" type="submit">Salvar alterações</button></div>
  </form>
</section>
{% endblock %}
