{% extends "carteira_base.html" %}
{% block dash_content %}
  <a class="wallet-back" href="{% url 'car:carteira_amostra' carteira.pk %}">← Voltar à carteira</a>
  <section class="wallet-form-card">
    <p class="wallet-eyebrow">{{ carteira.name }}</p><h2>Adicionar token ERC-20</h2><p class="wallet-subtitle">Informe o endereço do contrato publicado na rede Sepolia.</p>
    <form method="post" class="wallet-form">{% csrf_token %}{{ form.non_field_errors }}
      {% for field in form %}<label class="wallet-field"><span>{{ field.label }}</span>{{ field }}{% if field.errors %}<small>{{ field.errors|join:", " }}</small>{% endif %}</label>{% endfor %}
      <div class="wallet-form-actions"><a class="wallet-cancel" href="{% url 'car:carteira_amostra' carteira.pk %}">Cancelar</a><button class="wallet-primary" type="submit">Consultar e adicionar</button></div>
    </form>
  </section>
{% endblock %}
